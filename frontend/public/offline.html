<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — StoreForge</title>
  <link rel="icon" href="/icons/favicon-32x32.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F2;
      color: #2D241E;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EBE3D9;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(45, 36, 30, 0.05), 0 8px 10px -6px rgba(45, 36, 30, 0.03);
    }
    .icon-badge {
      width: 4rem;
      height: 4rem;
      border-radius: 1rem;
      background: #F4EBE1;
      color: #8E5A35;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
      font-size: 1.75rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #1A130E;
      margin-bottom: 0.5rem;
    }
    p {
      font-size: 0.9375rem;
      color: #7A6F66;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.875rem 1.5rem;
      border-radius: 0.875rem;
      font-size: 0.9375rem;
      font-weight: 700;
      color: #FFFFFF;
      background: #8E5A35;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #734524; }
    .btn:active { transform: scale(0.98); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.375rem 0.75rem;
      border-radius: 9999px;
      background: #FEE2E2;
      color: #991B1B;
      margin-bottom: 1.25rem;
    }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 9999px; background: #DC2626; }
  </style>
</head>
<body>
  <div class="card">
    <div class="status-badge">
      <span class="dot"></span>
      <span>No Internet Connection</span>
    </div>
    <div class="icon-badge">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <h1>You're Browsing Offline</h1>
    <p>Please check your network settings. Once your connection is back, tap below to reload the store.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
        <path d="M21 3v5h-5"></path>
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
        <path d="M8 16H3v5"></path>
      </svg>
      <span>Try Reconnecting</span>
    </button>
  </div>
</body>
</html>
