services:
  # ========================================================
  # 🐘 PostgreSQL Database Container
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-test
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ========================================================
  # ⚙️ NestJS Backend REST API Service
  # ========================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: storeforge-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8585}:8585"
    environment:
      PORT: ${BACKEND_PORT:-8585}
      DATABASE_URL: "${DOCKER_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-postgres}?schema=public}"
      JWT_SECRET: "${JWT_SECRET:-storeforge_super_secure_jwt_secret_change_in_production_2026}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      ADMIN_URL: "${ADMIN_URL:-http://localhost:4000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
      - /app/node_modules
      - ./backend/public/uploads:/app/backend/public/uploads

  # ========================================================
  # 🛍️ Next.js Customer Storefront
  # ========================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: storeforge-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: ${PORT:-3000}
      HOSTNAME: "0.0.0.0"
      INTERNAL_BACKEND_URL: "${INTERNAL_BACKEND_URL:-http://backend:8585}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8585}"
      NEXT_PUBLIC_STORE_URL: "${NEXT_PUBLIC_STORE_URL:-http://localhost:3000}"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
      - /app/frontend/.next
      - /app/node_modules

  # ========================================================
  # 🔐 Next.js Admin Portal
  # ========================================================
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: storeforge-admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-4000}:4000"
    environment:
      PORT: ${ADMIN_PORT:-4000}
      HOSTNAME: "0.0.0.0"
      INTERNAL_BACKEND_URL: "${INTERNAL_BACKEND_URL:-http://backend:8585}"
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8585}"
    depends_on:
      - backend
    volumes:
      - ./admin:/app/admin
      - /app/admin/node_modules
      - /app/admin/.next
      - /app/node_modules

volumes:
  postgres-data:
    driver: local
