<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { stroke: #cbd5e1; stroke-width: 9; fill: none; stroke-linejoin: round; }
      .slash { stroke: #94a3b8; stroke-width: 9; stroke-linecap: round; }
      .shape { fill: #cbd5e1; }
      .label { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 32px; font-weight: 400; letter-spacing: 0.5px; }
    </style>
    <clipPath id="frame-clip">
      <rect x="115" y="65" width="270" height="190" rx="8" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />

  <!-- Picture Frame -->
  <g id="photo-frame">
    <!-- Frame border -->
    <rect x="115" y="65" width="270" height="190" rx="8" class="frame" />

    <!-- Elements inside frame (clipped) -->
    <g clip-path="url(#frame-clip)">
      <!-- Sun -->
      <circle cx="175" cy="115" r="22" class="shape" />

      <!-- Back mountain -->
      <polygon points="180,255 240,155 310,255" class="shape" opacity="0.9" />

      <!-- Front / Larger mountain -->
      <polygon points="230,255 325,125 410,255" class="shape" />
    </g>

    <!-- Diagonal slash across the photo frame -->
    <line x1="395" y1="45" x2="105" y2="275" class="slash" />
  </g>

  <!-- "No image" label -->
  <text x="250" y="325" text-anchor="middle" class="label">No image</text>
</svg>
